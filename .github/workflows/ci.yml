name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'integration/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dojo_test
          POSTGRES_USER: dojo
          POSTGRES_PASSWORD: dojo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dojo -d dojo_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Django checks and tests
        working-directory: apps/api
        env:
          SECRET_KEY: ci-only-secret-key
          DEBUG: 'False'
          DATABASE_URL: postgresql://dojo:dojo@127.0.0.1:5432/dojo_test
          ALLOWED_HOSTS: localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: https://data-dojo-nine.vercel.app,https://data-dojo-nar3.vercel.app
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py test core --verbosity=2

      - name: Production settings check
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: config.settings_prod
          SECRET_KEY: ci-only-secret-key
          DEBUG: 'False'
          DATABASE_URL: postgresql://dojo:dojo@127.0.0.1:5432/dojo_test
          ALLOWED_HOSTS: localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS: https://data-dojo-nine.vercel.app,https://data-dojo-nar3.vercel.app
          CORS_ALLOWED_ORIGINS: https://data-dojo-nine.vercel.app,https://data-dojo-nar3.vercel.app
        run: |
          python manage.py check --deploy
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
